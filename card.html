<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Карточка</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="product-cards">
        <section class="product-cards__list">
            <article class="product-card">
                <div class="product-card__image-wrapper">
                    <img class="product-card__image" src="https://picsum.photos/300" alt="Пример товара">
                    <div class="product-card__overlay">
                        <h1 class="product-card__title">Название</h1>
                        <p class="product-card__short-desc">
                            Краткое описание товара или услуги, выделяющее его преимущества и уникальные особенности.
                        </p>
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>

</html>
